[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "goldbug"
version = "0.1.0"
description = "Which grader bugs will RL actually exploit?"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [{ name = "Julian Pielmaier" }]
keywords = ["reinforcement learning", "RLVR", "GRPO", "reward hacking", "verifiers", "evaluation"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Intended Audience :: Science/Research",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = ["numpy>=1.24", "scipy>=1.10"]

[project.optional-dependencies]
checkers = ["math-verify>=0.9", "sympy>=1.12", "pylatexenc>=2.10", "lm_eval>=0.4.13", "antlr4-python3-runtime==4.11", "reasoning-gym>=0.1.25"]
lab = ["torch>=2.2", "matplotlib>=3.8"]
dev = ["pytest>=8"]
all = ["goldbug[checkers,lab]", "scipy>=1.10"]

[project.scripts]
goldbug = "goldbug.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/goldbug"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
