name: ci
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install (CPU torch)
        run: |
          python -m pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -e ".[checkers,lab,dev]" scipy
      - name: Tests
        run: python -m pytest -q
      - name: Census smoke test (two checkers, hedges only)
        run: goldbug census --checkers math_verify verl_math --families control hedge --out /tmp/census
